name: Android CI
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: FinanzasInteligentes
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: finanzas-debug-apk
          path: FinanzasInteligentes/app/build/outputs/apk/debug/*.apk
